<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hash Maker</title>
<meta name="description" content="Type a word or a name and get its hash. SHA-256, SHA-1, SHA-512, MD5. Cut it to any length and copy it. Runs in your browser.">
<meta name="author" content="Jed Blenkhorn">
<link rel="canonical" href="https://hash.jedbillyb.com/">
<meta property="og:title" content="Hash Maker">
<meta property="og:description" content="Type a word or a name and get its hash. Cut it to any length and copy it.">
<meta property="og:url" content="https://hash.jedbillyb.com/">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23fff'/%3E%3Cpath d='M12 5 9 27M22 5l-3 22M6 12h21M5 20h21' stroke='%23111' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<script>try { if (localStorage.getItem('theme') === 'dark') document.documentElement.dataset.theme = 'dark'; } catch (e) {}</script>
<style>
:root { --bg: #fff; --fg: #111; --muted: #666; --line: #bbb; accent-color: #111; color-scheme: light; }
:root[data-theme="dark"] { --bg: #111; --fg: #eee; --muted: #999; --line: #444; accent-color: #eee; color-scheme: dark; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif; }
main { max-width: 760px; margin: 0 auto; padding: 24px 16px 12px; }
h1 { font-size: 1.6em; margin: 0 0 6px; }
h2 { font-size: 1.15em; margin: 36px 0 12px; }
p { margin: 0 0 10px; }
a { color: inherit; }
.muted { color: var(--muted); font-size: .9em; }
.byline { margin: 0 0 14px; }
fieldset { border: 0; padding: 0; margin: 0 0 14px; }
legend { padding: 0; margin-bottom: 6px; font-size: .9em; }
.inline { display: flex; flex-wrap: wrap; gap: 4px 18px; }
.block { display: grid; gap: 4px; font-size: .9em; margin-bottom: 18px; }
.block input { font-size: 16px; }
input, textarea { font: inherit; font-size: 16px; color: var(--fg); background: var(--bg); border: 1px solid var(--line); padding: 4px 6px; }
input[type=text], input[type=number] { -webkit-appearance: none; appearance: none; border-radius: 0; }
input[type=number] { -moz-appearance: textfield; }
textarea { width: 100%; box-sizing: border-box; resize: vertical; }
input[type=number] { width: 5em; }
input[type=range] { flex: 1; min-width: 120px; padding: 0; border: 0; }
.pair { display: flex; gap: 10px; align-items: center; }
button { font: inherit; padding: 6px 14px; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
.mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
.out { display: flex; gap: 10px; align-items: stretch; }
.out input { flex: 1; min-width: 0; }
details { margin: 0 0 10px; }
summary { cursor: pointer; font-size: .9em; margin-bottom: 10px; }
button.link { background: none; border: 0; padding: 0; color: inherit; font-size: inherit; text-decoration: underline; cursor: pointer; }
body, input, textarea { transition: background-color .4s, color .4s, border-color .4s; }
:root.cute { --bg: #ffe4ef; --fg: #a0124f; --muted: #c2477b; --line: #f19bbf; accent-color: #d6246e; }
:root.cute[data-theme="dark"] { --bg: #3a0f22; --fg: #ffc2da; --muted: #e88ab0; --line: #8a2f58; accent-color: #ff6fa8; }
.note { text-align: center; color: #e0336f; font-size: clamp(21px, 6vw, 44px); font-weight: bold; line-height: 1.2; max-height: 0; margin: 0; opacity: 0; transform: scale(.6); transition: opacity .35s, transform .5s cubic-bezier(.3, 1.6, .5, 1), max-height .35s, margin .35s; }
.note.on { opacity: 1; transform: scale(1); max-height: 3em; margin: 24px 0 8px; }
:root[data-theme="dark"] .note { color: #ff7fae; }
.heart { position: fixed; bottom: -40px; z-index: 9; pointer-events: none; color: #e8417f; animation: rise linear forwards; }
@keyframes rise { to { transform: translateY(-115vh) rotate(var(--r)); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .heart { display: none; } }
[hidden] { display: none !important; }
footer { width: min(760px, calc(100% - 32px)); margin: 0 auto; padding: 20px 0 40px; border-top: 1px solid var(--line); font-size: .9em; }
footer p { margin: 0 0 6px; }
footer .links { display: flex; flex-wrap: wrap; gap: 4px 16px; }
</style>
</head>
<body>
<main>
  <h1>Hash Maker</h1>
  <p class="byline muted">by <a href="https://jedbillyb.com/">Jed Blenkhorn</a></p>
  <p>Type something and copy its hash. Same text, same hash, every time.</p>

  <label class="block">Text
    <input type="text" id="text" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="Type here">
  </label>

  <div class="block">
    <label for="result">Hash</label>
    <div class="out">
      <input type="text" id="result" class="mono" readonly>
      <button type="button" id="copy">Copy</button>
    </div>
  </div>

  <fieldset>
    <legend>Length <span class="muted" id="full"></span></legend>
    <div class="pair">
      <input type="number" id="len" min="1" inputmode="numeric" aria-label="Length">
      <input type="range" id="slide" min="1" aria-label="Length slider">
    </div>
  </fieldset>

  <details>
  <summary>Advanced options</summary>
  <fieldset>
    <legend>Hash</legend>
    <div class="inline">
      <label><input type="radio" name="algo" value="SHA-256" checked> SHA-256</label>
      <label><input type="radio" name="algo" value="SHA-1"> SHA-1</label>
      <label><input type="radio" name="algo" value="SHA-512"> SHA-512</label>
      <label><input type="radio" name="algo" value="MD5"> MD5</label>
    </div>
  </fieldset>

  <fieldset>
    <legend>Letters</legend>
    <div class="inline">
      <label><input type="radio" name="fmt" value="hex" checked> abc123</label>
      <label><input type="radio" name="fmt" value="HEX"> ABC123</label>
      <label><input type="radio" name="fmt" value="b64"> Base64</label>
    </div>
  </fieldset>
  </details>

  <p class="note" id="note" role="status">aww rylee your so cute&nbsp;&#x2665;&#xFE0E;</p>

</main>
<footer>
  <p>Made by <a href="https://jedbillyb.com/">Jed Blenkhorn</a>. Try the <a href="https://font.jedbillyb.com/">Font Maker</a>.</p>
  <p class="links"><a href="https://github.com/jedbillyb">GitHub</a> <a href="mailto:hello@jedbillyb.com">Email</a> <a href="https://buymeacoffee.com/jedbillyb">Buy me a coffee</a> <button type="button" class="link" id="theme">Dark mode</button></p>
</footer>
<script>
(function () {
  var b = document.getElementById('theme'), r = document.documentElement;
  function label() { b.textContent = r.dataset.theme === 'dark' ? 'Light mode' : 'Dark mode'; }
  label();
  b.onclick = function () {
    if (r.dataset.theme === 'dark') delete r.dataset.theme; else r.dataset.theme = 'dark';
    try { localStorage.setItem('theme', r.dataset.theme || 'light'); } catch (e) {}
    label();
  };
})();
</script>
<script>
// MD5 is not in Web Crypto, so it is done here. Input and output are bytes.
function md5(bytes) {
  var S = [7, 12, 17, 22, 5, 9, 14, 20, 4, 11, 16, 23, 6, 10, 15, 21];
  var K = new Uint32Array(64);
  for (var i = 0; i < 64; i++) K[i] = Math.floor(Math.abs(Math.sin(i + 1)) * 4294967296);
  var n = bytes.length, total = Math.ceil((n + 9) / 64) * 64;
  var p = new Uint8Array(total);
  p.set(bytes); p[n] = 0x80;
  var dv = new DataView(p.buffer);
  dv.setUint32(total - 8, (n * 8) % 4294967296, true);
  dv.setUint32(total - 4, Math.floor(n * 8 / 4294967296), true);
  var a0 = 0x67452301, b0 = 0xefcdab89, c0 = 0x98badcfe, d0 = 0x10325476, M = new Uint32Array(16);
  for (var off = 0; off < total; off += 64) {
    for (var j = 0; j < 16; j++) M[j] = dv.getUint32(off + j * 4, true);
    var A = a0, B = b0, C = c0, D = d0;
    for (i = 0; i < 64; i++) {
      var F, g, r = i >> 4;
      if (r === 0) { F = (B & C) | (~B & D); g = i; }
      else if (r === 1) { F = (D & B) | (~D & C); g = (5 * i + 1) % 16; }
      else if (r === 2) { F = B ^ C ^ D; g = (3 * i + 5) % 16; }
      else { F = C ^ (B | ~D); g = (7 * i) % 16; }
      F = (F + A + K[i] + M[g]) >>> 0;
      var s = S[r * 4 + (i & 3)];
      A = D; D = C; C = B;
      B = (B + ((F << s) | (F >>> (32 - s)))) >>> 0;
    }
    a0 = (a0 + A) >>> 0; b0 = (b0 + B) >>> 0; c0 = (c0 + C) >>> 0; d0 = (d0 + D) >>> 0;
  }
  var out = new Uint8Array(16), ov = new DataView(out.buffer);
  ov.setUint32(0, a0, true); ov.setUint32(4, b0, true); ov.setUint32(8, c0, true); ov.setUint32(12, d0, true);
  return out;
}
</script>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var text = $('text'), len = $('len'), slide = $('slide'), full = $('full');
  var result = $('result');
  var BYTES = { 'SHA-1': 20, 'SHA-256': 32, 'SHA-512': 64, 'MD5': 16 };
  var want = null; // chosen length, null = full
  var run = 0, cute = false;

  function pick(name) { return document.querySelector('input[name=' + name + ']:checked').value; }
  function fullLength() {
    var b = BYTES[pick('algo')];
    return pick('fmt') === 'b64' ? Math.ceil(b / 3) * 4 : b * 2;
  }
  function encode(bytes, fmt) {
    if (fmt === 'b64') { var s = ''; for (var i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]); return btoa(s); }
    var h = ''; for (i = 0; i < bytes.length; i++) h += bytes[i].toString(16).padStart(2, '0');
    return fmt === 'HEX' ? h.toUpperCase() : h;
  }
  function digest(algo, str) {
    var bytes = new TextEncoder().encode(str);
    if (algo === 'MD5') return Promise.resolve(md5(bytes));
    return crypto.subtle.digest(algo, bytes).then(function (b) { return new Uint8Array(b); });
  }

  function syncLength() {
    var max = fullLength();
    len.max = slide.max = max;
    var v = want === null ? max : Math.min(want, max);
    len.value = slide.value = v;
    full.textContent = '(full is ' + max + ')';
    return v;
  }

  function update() {
    var n = syncLength(), algo = pick('algo'), fmt = pick('fmt'), me = ++run;
    egg();
    if (text.value === '') { result.value = ''; return; }
    digest(algo, text.value).then(function (b) {
      if (me !== run) return; // a newer keystroke already started
      result.value = encode(b, fmt).slice(0, n);
    });
  }

  function copy(s, btn) {
    if (!s) return;
    var done = function () { btn.textContent = 'Copied'; setTimeout(function () { btn.textContent = btn.dataset.label; }, 1200); };
    btn.dataset.label = btn.dataset.label || btn.textContent;
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(s).then(done, fallback);
    else fallback();
    function fallback() {
      var t = document.createElement('textarea'); t.value = s; document.body.appendChild(t); t.select();
      try { document.execCommand('copy'); done(); } catch (e) {}
      t.remove();
    }
  }

  function setWant(v) {
    v = parseInt(v, 10);
    if (isNaN(v)) return;
    v = Math.max(1, Math.min(v, fullLength()));
    want = v === fullLength() ? null : v;
    update();
  }

  // Easter egg: typing "jed" turns the page pink.
  var note = $('note');
  function egg() {
    var now = text.value.trim().toLowerCase() === 'jed';
    if (now === cute) return;
    cute = now;
    document.documentElement.classList.toggle('cute', cute);
    note.classList.toggle('on', cute);
    if (!cute) return;
    for (var i = 0; i < 24; i++) {
      var h = document.createElement('span');
      h.className = 'heart';
      h.textContent = '\u2665\uFE0E';
      h.style.left = Math.random() * 100 + 'vw';
      h.style.fontSize = 16 + Math.random() * 28 + 'px';
      h.style.animationDuration = 2.5 + Math.random() * 2.5 + 's';
      h.style.animationDelay = Math.random() * 1.2 + 's';
      h.style.setProperty('--r', (Math.random() * 80 - 40) + 'deg');
      h.addEventListener('animationend', function () { this.remove(); });
      document.body.appendChild(h);
    }
  }

  text.addEventListener('input', update);
  document.querySelectorAll('input[name=algo], input[name=fmt]').forEach(function (r) { r.addEventListener('change', update); });
  slide.addEventListener('input', function () { setWant(slide.value); });
  len.addEventListener('change', function () { setWant(len.value); });
  len.addEventListener('input', function () { if (len.value !== '') setWant(len.value); });
  $('copy').onclick = function () { copy(result.value, $('copy')); };
  result.addEventListener('focus', function () { result.setSelectionRange(0, result.value.length); });
  update();
})();
</script>
</body>
</html>
